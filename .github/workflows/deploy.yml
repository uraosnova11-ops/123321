name: Run Telegram Offer Bot

on:
  schedule:
    - cron: '0 */5 * * *'  # Запуск каждые 5 часов
  workflow_dispatch:       # Возможность запустить вручную

# Защита от двойного запуска (убивает старый процесс, если вы нажали Run дважды)
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290   # Ограничение по времени (чуть меньше 5 часов)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # УСТАНОВКА FFMPEG И CAIRO (для конвертации Lottie в MP4)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
